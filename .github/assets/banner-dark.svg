<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="UploadRescue — Never lose an upload again">
<title>UploadRescue — Never lose an upload again</title>
<rect x="0.5" y="0.5" width="879" height="299" rx="14" fill="#0d1117" stroke="#30363d"/>
<g transform="translate(40 52) scale(1.375)">
  <rect width="32" height="32" rx="7" fill="#e6edf3"/>
  <path d="M16 22V9m0 0-5 5m5-5 5 5" fill="none" stroke="#0d1117" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="24" cy="24" r="4" fill="#3fb950"/>
</g>
<text x="98" y="84" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#e6edf3" letter-spacing="-0.5">UploadRescue</text>
<text x="40" y="140" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#e6edf3">Never lose an upload again.</text>
<text x="40" y="172" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#8b949e">Detect failed uploads, optimize files in the browser,</text>
<text x="40" y="194" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#8b949e">and retry your own upload function — automatically.</text>
<rect x="40" y="226" width="86" height="26" rx="13" fill="none" stroke="#30363d"/><text x="83" y="243.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b949e" text-anchor="middle">Apache 2.0</text>
<rect x="134" y="226" width="82" height="26" rx="13" fill="none" stroke="#30363d"/><text x="175" y="243.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b949e" text-anchor="middle">No API key</text>
<rect x="224" y="226" width="84" height="26" rx="13" fill="none" stroke="#30363d"/><text x="266" y="243.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b949e" text-anchor="middle">No backend</text>
<rect x="316" y="226" width="96" height="26" rx="13" fill="none" stroke="#30363d"/><text x="364" y="243.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b949e" text-anchor="middle">No telemetry</text>
<rect x="470" y="28" width="382" height="76" rx="10" fill="#1f1416" stroke="#5a2a2a"/>
<text x="488" y="54" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#f85149">Your file is too large.</text>
<text x="488" y="76" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">Maximum allowed: 2 MB.</text>
<text x="488" y="93" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">Your file: 20.3 MB.</text>
<rect x="700" y="44" width="134" height="26" rx="6" fill="#e6edf3"/>
<text x="767" y="61" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d1117" text-anchor="middle">Compress &amp; Retry</text>
<rect x="470" y="116" width="382" height="62" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="488" y="141" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#e6edf3">Optimizing your file…</text>
<rect x="488" y="155" width="346" height="6" rx="3" fill="#161b22"/>
<rect x="488" y="155" width="220" height="6" rx="3" fill="#e6edf3"/>
<rect x="470" y="190" width="382" height="82" rx="10" fill="#12201a" stroke="#1f4d2e"/>
<text x="488" y="215" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#3fb950">Upload completed successfully.</text>
<text x="488" y="240" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">Original 20.3 MB</text>
<text x="610" y="240" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">Optimized 1.93 MB</text>
<text x="738" y="240" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#3fb950">Reduction 90.5%</text>
<text x="488" y="260" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#8b949e">Measured: 12 MP JPEG → 2 MB limit, Chromium</text>
</svg>
