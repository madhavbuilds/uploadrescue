<rect x="500" y="300" width="108" height="46" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1" stroke-dasharray="5 4"/><text x="554" y="324"  font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#e6edf3" text-anchor="middle">media</text><text x="554" y="342" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">engine</text>
