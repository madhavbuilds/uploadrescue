<text x="28" y="374" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b949e">Dashed = optional package. Engines load lazily; the upload goes only where your function sends it.</text>
