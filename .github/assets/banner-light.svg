<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="UploadRescue — Never lose an upload again">
<title>UploadRescue — Never lose an upload again</title>
<rect x="0.5" y="0.5" width="879" height="299" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
<g transform="translate(40 52) scale(1.375)">
  <rect width="32" height="32" rx="7" fill="#171717"/>
  <path d="M16 22V9m0 0-5 5m5-5 5 5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="24" cy="24" r="4" fill="#16a34a"/>
</g>
<text x="98" y="84" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#171717" letter-spacing="-0.5">UploadRescue</text>
<text x="40" y="140" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#171717">Never lose an upload again.</text>
<text x="40" y="172" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#64748b">Detect failed uploads, optimize files in the browser,</text>
<text x="40" y="194" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#64748b">and retry your own upload function — automatically.</text>
<rect x="40" y="226" width="86" height="26" rx="13" fill="none" stroke="#e4e4e7"/><text x="83" y="243.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">Apache 2.0</text>
<rect x="134" y="226" width="82" height="26" rx="13" fill="none" stroke="#e4e4e7"/><text x="175" y="243.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">No API key</text>
<rect x="224" y="226" width="84" height="26" rx="13" fill="none" stroke="#e4e4e7"/><text x="266" y="243.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">No backend</text>
<rect x="316" y="226" width="96" height="26" rx="13" fill="none" stroke="#e4e4e7"/><text x="364" y="243.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">No telemetry</text>
<rect x="470" y="28" width="382" height="76" rx="10" fill="#fef2f2" stroke="#fecaca"/>
<text x="488" y="54" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#dc2626">Your file is too large.</text>
<text x="488" y="76" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">Maximum allowed: 2 MB.</text>
<text x="488" y="93" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">Your file: 20.3 MB.</text>
<rect x="700" y="44" width="134" height="26" rx="6" fill="#171717"/>
<text x="767" y="61" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Compress &amp; Retry</text>
<rect x="470" y="116" width="382" height="62" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
<text x="488" y="141" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#171717">Optimizing your file…</text>
<rect x="488" y="155" width="346" height="6" rx="3" fill="#f4f4f5"/>
<rect x="488" y="155" width="220" height="6" rx="3" fill="#171717"/>
<rect x="470" y="190" width="382" height="82" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="488" y="215" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#15803d">Upload completed successfully.</text>
<text x="488" y="240" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">Original 20.3 MB</text>
<text x="610" y="240" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">Optimized 1.93 MB</text>
<text x="738" y="240" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#15803d">Reduction 90.5%</text>
<text x="488" y="260" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">Measured: 12 MP JPEG → 2 MB limit, Chromium</text>
</svg>
