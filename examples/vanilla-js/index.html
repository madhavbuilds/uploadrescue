<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UploadRescue — Vanilla JS example</title>
    <style>
      body {
        max-width: 560px;
        margin: 48px auto;
        padding: 0 16px;
        font-family: system-ui, sans-serif;
      }
      #drop-area {
        margin-top: 12px;
        padding: 24px;
        border: 2px dashed #a1a1aa;
        border-radius: 10px;
        text-align: center;
        color: #52525b;
      }
      #drop-area[data-dragging] {
        border-color: #2563eb;
      }
    </style>
  </head>
  <body>
    <h1>UploadRescue · Vanilla JS</h1>
    <p>The server accepts files up to <strong>1 MB</strong>. Choose or drop a larger image.</p>
    <label for="upload-input">Choose a file</label>
    <input id="upload-input" type="file" accept="image/*" />
    <div id="drop-area">…or drop a file here</div>
    <ol id="log"></ol>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
